<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brew Journal — Coarse Correct</title>
  <meta name="theme-color" content="#D5431A">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Hanken+Grotesk:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("coarseCorrect_theme");
        if (t !== "dark" && t !== "light") {
          t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="header-row">
        <div class="brand-lockup">
          <span class="brand-mark"><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="20" cy="20" r="15"/><path d="M20 20 L20 5 A15 15 0 0 1 33 27 Z" fill="currentColor" stroke="none"/><g stroke-width="1.5"><line x1="20.00" y1="5.00" x2="20.00" y2="2.40"/><line x1="27.50" y1="7.01" x2="28.80" y2="4.76"/><line x1="32.99" y1="12.50" x2="35.24" y2="11.20"/><line x1="35.00" y1="20.00" x2="37.60" y2="20.00"/><line x1="32.99" y1="27.50" x2="35.24" y2="28.80"/><line x1="27.50" y1="32.99" x2="28.80" y2="35.24"/><line x1="20.00" y1="35.00" x2="20.00" y2="37.60"/><line x1="12.50" y1="32.99" x2="11.20" y2="35.24"/><line x1="7.01" y1="27.50" x2="4.76" y2="28.80"/><line x1="5.00" y1="20.00" x2="2.40" y2="20.00"/><line x1="7.01" y1="12.50" x2="4.76" y2="11.20"/><line x1="12.50" y1="7.01" x2="11.20" y2="4.76"/></g><circle cx="20" cy="20" r="3.7" fill="var(--bg)" stroke-width="2"/></svg></span>
          <h1>Brew Journal</h1>
        </div>
        <div class="header-actions">
          <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode" aria-pressed="false">
            <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4 6.3 6.3 0 0 0 20 14.5Z"/></svg>
            <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>
          </button>
          <a href="index.html" class="nav-link">&larr; Grinder</a>
        </div>
      </div>
      <p class="subtitle">Your dial-in history</p>
    </header>

    <div class="journal-controls">
      <div class="journal-filters">
        <button type="button" class="filter-btn active" data-filter="all">All</button>
        <button type="button" class="filter-btn" data-filter="espresso">Espresso</button>
        <button type="button" class="filter-btn" data-filter="v60">V60</button>
        <button type="button" class="filter-btn" data-filter="chemex">Chemex</button>
        <button type="button" class="filter-btn" data-filter="frenchPress">French Press</button>
      </div>
      <select id="sort-select" class="journal-sort">
        <option value="newest">Newest First</option>
        <option value="oldest">Oldest First</option>
      </select>
    </div>

    <div id="journal-list" class="journal-list"></div>

    <div id="journal-empty" class="journal-empty hidden">
      <p>No brews logged yet.</p>
      <a href="index.html">Go brew something!</a>
    </div>

    <button type="button" id="clear-all-btn" class="clear-all-btn hidden">Clear All Brews</button>

    <div id="confirm-clear" class="confirm-clear hidden">
      <p>Delete all brew logs? This can't be undone.</p>
      <div class="confirm-buttons">
        <button type="button" id="confirm-yes" class="confirm-yes">Yes, delete all</button>
        <button type="button" id="confirm-no" class="confirm-no">Cancel</button>
      </div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/journal.js"></script>
  <script src="js/ui-enhance.js"></script>
</body>
</html>
